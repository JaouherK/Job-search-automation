name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request stops the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On main, a pull request's merge commit holds exactly the code its pull
  # request's run checked when its tree is the branch head's (the branch was
  # up to date with main). Then main only builds the image. Anything else
  # pushed to main is checked in full: direct pushes, merges of a branch that
  # was behind, and publishes to the public repository.
  checked:
    name: Checked in its pull request?
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.find.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit and its parents.
          fetch-depth: 2

      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if head=$(git rev-parse -q --verify 'HEAD^2') && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$head^{tree}")" ]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head&event=pull_request&status=success" \
              -q '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")] | length' || echo 0)
            if [ "${passed:-0}" -gt 0 ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            echo "Same code as $head, which passed CI in its pull request: only the image is built." >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    name: Lint, type-check and test
    needs: checked
    # Runs on pull requests too, where "checked" is skipped.
    if: ${{ !cancelled() && needs.checked.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    services:
      # For the database tests (*.db.test.ts), which create and migrate their own
      # "dossier_test" database on this server.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dossier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dossier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dossier
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      # Fails when coverage drops below the thresholds in vitest.config.mts (E11-1).
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End-to-end tests
    needs: checked
    if: ${{ !cancelled() && needs.checked.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    services:
      # The tests create and migrate their own "dossier_e2e" database here.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dossier
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dossier"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dossier
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      # Headless Chromium, for the tests and for the app's PDFs.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # After both checks pass on main, or when its pull request passed them: the
  # production image on GHCR, tagged with the commit SHA (and "main"). A
  # version tag then tags it with the version.
  image:
    name: Production image
    needs: [checked, check, e2e]
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        # GHCR names must be lower case.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
